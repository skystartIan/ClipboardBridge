name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 固定簽章：keystore 存在 repo secret CI_KEYSTORE_B64（加密、不會過期）。
      #
      # 原本用 actions/cache 存，但**快取超過 7 天沒被存取就會被 GitHub 清掉**。
      # 這個專案久久才 build 一次，2026-09-01 那次隔了 35 天，快取沒了 → CI 自己
      # 產了新 keystore → 簽章變了 → adb install -r 直接 INSTALL_FAILED_UPDATE_
      # INCOMPATIBLE，而且舊的那把再也救不回來（快取無備份），只能移除重裝、
      # 重新授權通知存取／無障礙／Shizuku。用 cache 做簽章穩定性是假的。
      - name: Restore CI keystore
        id: ks
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ]; then
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > app/ci.keystore
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "restored keystore from secret"
          else
            keytool -genkeypair -v -keystore app/ci.keystore -alias cb \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass clipboard -keypass clipboard \
              -dname "CN=ClipboardBridge, OU=CI, O=CB, L=X, ST=X, C=US"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CI_KEYSTORE_B64 未設定；本次自產 keystore 並上傳為 artifact，請下載後存成 secret"
          fi

      # 只在 secret 還沒設定時上傳，供一次性取得。設定好之後這步自動停用，
      # 簽章金鑰就不會再出現在 artifact 裡。
      - name: Upload keystore for one-time bootstrap
        if: steps.ks.outputs.bootstrap == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-keystore-bootstrap
          path: app/ci.keystore
          retention-days: 1

      - name: Build Release APK
        run: gradle assembleRelease
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardBridge
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
